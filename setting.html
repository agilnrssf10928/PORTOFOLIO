<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setting | Portofolio Agil</title>
<style>
  :root { color-scheme: dark; --bg:#07111f; --panel:#0e1d31; --line:#23405f; --text:#e8f1fb; --muted:#91a7bd; --accent:#35b9d2; --danger:#ff7b87; }
  * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:radial-gradient(circle at top right,#153957 0,#07111f 48%); color:var(--text); font:16px/1.5 Segoe UI,sans-serif; }
  main { width:min(760px,calc(100% - 32px)); margin:48px auto; } .brand { color:var(--accent); letter-spacing:.12em; text-transform:uppercase; font-size:.75rem; font-weight:700; }
  h1 { margin:8px 0 28px; font-size:clamp(2rem,6vw,3.5rem); line-height:1.05; } h2 { font-size:1.15rem; margin-top:0; }
  .panel { background:rgba(14,29,49,.9); border:1px solid var(--line); border-radius:14px; padding:24px; box-shadow:0 20px 60px #0005; } .hidden { display:none; }
  label { display:block; color:var(--muted); font-size:.9rem; margin:18px 0 7px; } input,textarea { width:100%; border:1px solid var(--line); border-radius:8px; background:#091727; color:var(--text); padding:12px 14px; font:inherit; outline:none; } textarea { min-height:125px; resize:vertical; } input:focus,textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px #35b9d233; }
  button { border:0; border-radius:8px; padding:12px 17px; background:var(--accent); color:#04111a; font-weight:700; cursor:pointer; } button.secondary { background:transparent; border:1px solid var(--line); color:var(--text); } .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; } .status { min-height:24px; margin-top:14px; color:var(--muted); } .error { color:var(--danger); } .note { color:var(--muted); font-size:.9rem; margin-top:6px; } .topline { display:flex; justify-content:space-between; align-items:center; gap:12px; } @media(max-width:520px){main{margin:24px auto}.panel{padding:18px}.topline{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
  <div class="brand">Private workspace</div>
  <h1>Atur portofolio.</h1>
  <section id="loginPanel" class="panel">
    <h2>Masuk ke pengaturan</h2>
    <p class="note">Halaman ini dilindungi session server, bukan password di browser.</p>
    <label for="password">Password admin</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="actions"><button id="loginButton">Masuk</button></div>
    <div id="loginStatus" class="status"></div>
  </section>
  <section id="editorPanel" class="panel hidden">
    <div class="topline"><h2>Konten utama</h2><button id="logoutButton" class="secondary">Keluar</button></div>
    <label for="name">Nama</label><input id="name">
    <label for="photoUrl">URL/path foto</label><input id="photoUrl"><div class="note">Contoh: `foto.jpg` atau URL gambar publik.</div>
    <label for="heroId">Deskripsi hero (Indonesia)</label><textarea id="heroId"></textarea>
    <label for="heroEn">Deskripsi hero (English)</label><textarea id="heroEn"></textarea>
    <label for="aboutId">Tentang saya (Indonesia)</label><textarea id="aboutId"></textarea>
    <label for="aboutEn">About me (English)</label><textarea id="aboutEn"></textarea>
    <div class="actions"><button id="saveButton">Simpan perubahan</button><a href="/" style="color:var(--accent);padding:12px 0">Lihat website</a></div>
    <div id="saveStatus" class="status"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const fields = { name: $('name'), photoUrl: $('photoUrl'), heroId: $('heroId'), heroEn: $('heroEn'), aboutId: $('aboutId'), aboutEn: $('aboutEn') };
function status(element, message, error = false) { element.textContent = message; element.className = `status${error ? ' error' : ''}`; }
async function loadContent() {
  const response = await fetch('/api/content');
  if (!response.ok) throw new Error('Penyimpanan belum siap.');
  const data = await response.json();
  fields.name.value = data.name || ''; fields.photoUrl.value = data.photoUrl || '';
  fields.heroId.value = data.heroDesc?.id || ''; fields.heroEn.value = data.heroDesc?.en || '';
  fields.aboutId.value = data.about?.id || ''; fields.aboutEn.value = data.about?.en || '';
}
$('loginButton').onclick = async () => { status($('loginStatus'), 'Memeriksa...'); try { const response = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:$('password').value}) }); if (!response.ok) throw new Error((await response.json()).error || 'Login gagal.'); $('loginPanel').classList.add('hidden'); $('editorPanel').classList.remove('hidden'); await loadContent(); } catch (error) { status($('loginStatus'), error.message, true); } };
$('saveButton').onclick = async () => { status($('saveStatus'), 'Menyimpan...'); const content = { name:fields.name.value, photoUrl:fields.photoUrl.value, heroDesc:{id:fields.heroId.value,en:fields.heroEn.value}, about:{id:fields.aboutId.value,en:fields.aboutEn.value} }; const response = await fetch('/api/content', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(content) }); status($('saveStatus'), response.ok ? 'Perubahan tersimpan.' : 'Gagal menyimpan.', !response.ok); };
$('logoutButton').onclick = async () => { await fetch('/api/logout', { method:'POST' }); location.reload(); };
$('password').addEventListener('keydown', event => { if (event.key === 'Enter') $('loginButton').click(); });
</script>
</body>
</html>
